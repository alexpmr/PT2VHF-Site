<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato | PT2VHF</title>
  <meta name="description" content="Envie sugestões, ideias de melhorias e relatos de problemas sobre os projetos PT2VHF.">
  <link rel="stylesheet" href="/assets/css/style.css?v=20261114-aprs202">
  <link rel="stylesheet" href="/assets/css/aprs-language-menu.css?v=20261106-aprs1158">
  <style>
    .contact-form-wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .contact-form { display: grid; gap: 1rem; }
    .contact-form label { display: grid; gap: .4rem; font-weight: 600; }
    .contact-form input, .contact-form textarea { width: 100%; box-sizing: border-box; padding: .8rem .9rem; border: 1px solid #b9c4d0; border-radius: .45rem; font: inherit; }
    .contact-form textarea { min-height: 10rem; resize: vertical; }
    .contact-form button { width: fit-content; padding: .8rem 1.25rem; border: 0; border-radius: .45rem; background: #0b1220; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .contact-form button:hover { opacity: .9; }
    .contact-form .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .notice { margin: 0 auto 1rem; max-width: 760px; padding: .85rem 1rem; border-radius: .45rem; }
    .notice.ok { background: #e6f6ea; color: #14532d; }
    .notice.error { background: #fde8e8; color: #991b1b; }
  </style>
</head>
<body class="contact-page">
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="PT2VHF, início"><span>PT2VHF</span></a>
      <nav class="site-nav" aria-label="Principal">
        <a href="/">Início</a>
        <a href="/sobre">Sobre</a>
        <a href="/contato" aria-current="page">Contato</a>
      </nav>
    </div>
  </header>

  <main id="conteudo">
    <section class="section contact-page-hero">
      <div class="container contact-callout">
        <p class="eyebrow mono">CONTATO · PT2VHF</p>
        <h1>Envie sua mensagem</h1>
        <p>Envie sugestões, ideias de melhorias e relatos de problemas sobre os projetos PT2VHF.</p>
        <p>Você também pode escrever diretamente para <a href="mailto:alexpmr@gmail.com">alexpmr@gmail.com</a>.</p>
      </div>
    </section>

    <section class="section section-alt">
      <div class="contact-form-wrap">
        <div id="notice" class="notice" hidden></div>
        <form class="contact-form" action="/enviar-contato.php" method="post">
          <label>Nome
            <input type="text" name="nome" autocomplete="name" maxlength="120" required>
          </label>
          <label>E-mail
            <input type="email" name="email" autocomplete="email" maxlength="254" required>
          </label>
          <label>Assunto
            <input type="text" name="assunto" maxlength="180">
          </label>
          <label>Mensagem
            <textarea name="mensagem" maxlength="10000" required></textarea>
          </label>
          <label class="hp" aria-hidden="true">Website
            <input type="text" name="website" tabindex="-1" autocomplete="off">
          </label>
          <button type="submit">Enviar mensagem</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year">2026</span> PT2VHF. Todos os direitos reservados.</p>
      <p class="mono">73 de PT2VHF</p>
    </div>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const notice = document.getElementById('notice');
    if (params.get('enviado') === '1') {
      notice.textContent = 'Mensagem enviada com sucesso. Obrigado pelo contato!';
      notice.className = 'notice ok';
      notice.hidden = false;
    } else if (params.get('erro') === '1') {
      notice.textContent = 'Não foi possível enviar a mensagem. Verifique os dados e tente novamente.';
      notice.className = 'notice error';
      notice.hidden = false;
    }
  </script>
</body>
</html>

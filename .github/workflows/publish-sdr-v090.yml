name: Publicar SDR Tool v0.9.0 no site oficial
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-sdr-v090.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pt2vhf-publish-sdr-v090
  cancel-in-progress: false
env:
  VERSION: "0.9.0"
  SOURCE_SHA: "c84f902936272b24e9c2eb7d6953b3f0a415e318"
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aguardar release Windows aprovada no repositório SDR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Uma tag existente só é aceita se apontar para o commit solicitado.
          for i in $(seq 1 100); do
            if gh api "repos/alexpmr/PT2VHF-SDR-Tool/releases/tags/v$VERSION" > /tmp/sdr_release.json 2>/dev/null; then
              actual="$(gh api "repos/alexpmr/PT2VHF-SDR-Tool/git/ref/tags/v$VERSION" --jq '.object.sha')"
              if [ "$actual" != "$SOURCE_SHA" ]; then
                echo "::error::Tag SDR v$VERSION aponta para $actual em vez de $SOURCE_SHA"
                exit 1
              fi
              jq -e --arg v "$VERSION" '
                [.assets[].name] as $names |
                (("PT2VHF-SDR-Tool-v"+$v+"-Win11-x64-Setup.exe") as $setup |
                 ("PT2VHF-SDR-Tool-v"+$v+"-Win11-x64-Portable.exe") as $portable |
                 ($names | index($setup) != null and index($portable) != null and index("SHA256SUMS.txt") != null))
              ' /tmp/sdr_release.json
              echo "Release e 3 assets confirmados no commit $SOURCE_SHA"
              exit 0
            fi
            echo "Build SDR v$VERSION ainda sem release aprovada ($i/100)"
            sleep 30
          done
          echo "::error::Release SDR v$VERSION não ficou disponível; publicação cancelada"
          exit 1
      - name: Baixar Setup e Portable e validar integridade
        run: |
          set -euo pipefail
          mkdir -p artifacts
          base="https://github.com/alexpmr/PT2VHF-SDR-Tool/releases/download/v$VERSION"
          for file in SHA256SUMS.txt "PT2VHF-SDR-Tool-v$VERSION-Win11-x64-Setup.exe" "PT2VHF-SDR-Tool-v$VERSION-Win11-x64-Portable.exe"; do
            curl --fail --location --show-error --silent --retry 5 --retry-delay 5 -o "artifacts/$file" "$base/$file"
          done
          cd artifacts
          sed '1s/^\xef\xbb\xbf//' SHA256SUMS.txt | tr -d '\r' | awk 'NF>=3 { print $1"  "$3 }' | sha256sum -c -
      - name: Publicar arquivos segmentados e manifesto
        run: |
          set -euo pipefail
          python3 scripts/publish_sdr_release.py "$VERSION" artifacts "Nova recepção RS41 via IQ do SDR e decodificadores externos fsk_demod/rs41mod, previsão SGP4 de passagens, Doppler RX, iGate APRS somente RX e menu com sete idiomas (tradução parcial). Outros decodificadores, IA neural e validação RF real seguem pendentes."
          python3 -m json.tool updates.json >/dev/null
          php -l download.php
          php -l update.php
          git status --short
      - name: Commitar artefatos e manifesto no repositório do site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A updates.json downloads/sdr-tool
          if ! git diff --cached --quiet; then
            git commit -m "release(sdr): publicar 0.9.0 no site oficial"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verificar o site publicado, manifesto e SHA-256
        run: |
          set -euo pipefail
          python3 scripts/verify_sdr_live.py "$VERSION" --wait

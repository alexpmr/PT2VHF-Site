name: Verify published APRS Android v0.1.6 snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signed-apk-and-ota:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check APK hash, size and OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.6.apk"
          test -s "$apk"
          test "$(stat -c '%s' "$apk")" = 7462335
          echo "b92bd2238a74d74b6a152974139ca8131aa9109bd62b6f460140458d9ccb64b3  $apk" | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('updates.json').read_text(encoding='utf-8'))
          android=data['products']['aprs-android']
          assert android['version']=='0.1.6'
          assert len(android['files']) == 1
          f=android['files'][0]
          assert f['name']=='PT2VHF_APRS_Client_Android_v0.1.6.apk'
          assert f['sha256']=='b92bd2238a74d74b6a152974139ca8131aa9109bd62b6f460140458d9ccb64b3'
          assert f['counterKey']=='android-apk'
          print('ANDROID_016_APK_AND_OTA_VERIFIED=1')
          PY

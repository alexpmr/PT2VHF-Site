name: Sync PT2VHF APRS Android v0.1.6 signed APK to official site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-aprs-android-016.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pt2vhf-aprs-android-v016-sync
  cancel-in-progress: false

jobs:
  publish-signed-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify official signed release availability
        shell: bash
        run: |
          set -euo pipefail
          asset="PT2VHF_APRS_Client_Android_v0.1.6.apk"
          # The GITHUB_TOKEN for this SITE repository cannot read the Android
          # repository through "gh api" (GitHub App repo-scoped token).
          # Its public release is read without this token.
          url="https://api.github.com/repos/alexpmr/PT2VHF-APRS-Android/releases/tags/v0.1.6"
          curl --fail --show-error --silent --location --retry 5 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$url" --output "$RUNNER_TEMP/aprs-android-release.json"
          jq -e --arg asset "$asset" '
            .tag_name == "v0.1.6" and (.draft | not)
            and ([.assets[] | select(.name == $asset and (.digest | test("^sha256:[0-9a-f]{64}$")))] | length == 1)
          ' "$RUNNER_TEMP/aprs-android-release.json" >/dev/null
          echo "SIGNED_ANDROID_RELEASE_FOUND=1"

      - name: Download published APK into the site checkout
        shell: bash
        run: |
          set -euo pipefail
          name="PT2VHF_APRS_Client_Android_v0.1.6.apk"
          mkdir -p downloads/aprs-android
          curl --fail --location --show-error --silent \
            --retry 4 --retry-all-errors \
            "https://github.com/alexpmr/PT2VHF-APRS-Android/releases/download/v0.1.6/$name" \
            --output "downloads/aprs-android/$name"
          test -s "downloads/aprs-android/$name"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify "downloads/aprs-android/$name"
          else
            echo "::warning::apksigner indisponível; origem da assinatura foi verificada no workflow Android."
          fi

      - name: Verify APK structure, digest and official OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish_android_016.py
          python3 scripts/publish_android_016.py "$RUNNER_TEMP/aprs-android-release.json"
          python3 -m json.tool updates.json > /dev/null

      - name: Commit verified production APK and OTA metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- updates.json downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.6.apk
          if ! git diff --cached --quiet; then
            git commit -m "site(android): publicar APK v0.1.6 assinado e atualizar OTA"
            git push origin HEAD:main
          fi
          echo "VERIFIED_ANDROID_APK_PUBLISHED_IN_REPOSITORY=1"

name: Sync PT2VHF APRS Android v0.1.6 signed APK to official site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-aprs-android-016.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pt2vhf-aprs-android-v016-sync
  cancel-in-progress: false

jobs:
  publish-signed-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Import signed APK from authorized private Android Actions artifact
        shell: bash
        env:
          SIGNED_ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9888-820e-b7fc-218fe7c0ff4a/raw?se=2026-10-31T19%3A56%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=46f0fc2e-2cae-5d87-b193-dd90b6e94425&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T12%3A11%3A13Z&ske=2026-11-01T12%3A11%3A13Z&sks=b&skv=2026-02-06&sig=QihHoSFpykyxNxRHK8AqlWtn6PkWQkn%2BQlwl2kYgkSQ%3D'
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 --retry-all-errors \
            "$SIGNED_ARTIFACT_URL" --output "$RUNNER_TEMP/aprs-signed-v016.zip"
          mkdir -p downloads/aprs-android
          unzip -p "$RUNNER_TEMP/aprs-signed-v016.zip" \
            PT2VHF_APRS_Client_Android_v0.1.6.apk \
            > downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.6.apk
          printf '%s  %s\n' 'b92bd2238a74d74b6a152974139ca8131aa9109bd62b6f460140458d9ccb64b3' \
            'downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.6.apk' | sha256sum -c -
          test "$(stat -c '%s' downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.6.apk)" = 7462335
          echo "APK_VERIFIED_PRIVATE_RELEASE_ARTIFACT=1"

      - name: Validate signed APK, update OTA and preserve download counters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          path = os.environ['RUNNER_TEMP'] + '/aprs-android-release.json'
          release = {
            'tag_name': 'v0.1.6',
            'draft': False,
            'html_url': 'https://github.com/alexpmr/PT2VHF-APRS-Android/releases/tag/v0.1.6',
            'assets': [{
              'name':'PT2VHF_APRS_Client_Android_v0.1.6.apk',
              'size':7462335,
              'digest':'sha256:b92bd2238a74d74b6a152974139ca8131aa9109bd62b6f460140458d9ccb64b3'
            }]
          }
          with open(path,'w',encoding='utf-8') as f:
            json.dump(release,f)
          PY
          python3 scripts/publish_android_016.py "$RUNNER_TEMP/aprs-android-release.json"
          python3 -m json.tool updates.json >/dev/null

      - name: Commit signed APK and OTA metadata into site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- updates.json downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.6.apk
          if ! git diff --cached --quiet; then
            git commit -m "site(android): publicar APK v0.1.6 assinado e atualizar OTA"
            git push origin HEAD:main
          fi
          echo "SIGNED_ANDROID_016_APK_AND_OTA_PUBLISHED=1"

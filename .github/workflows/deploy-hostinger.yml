name: Deploy na Hostinger (www.pt2vhf.com)

# Cada push na main publica o site na Hostinger por FTPS (TLS obrigatório e verificado).
# Envia só o que mudou desde o último deploy (marcador .deploy-sha no servidor);
# no primeiro deploy, ou com "full" no disparo manual, envia tudo.
# Secrets necessários (Settings > Secrets and variables > Actions):
#   HOSTINGER_FTP_HOST, HOSTINGER_FTP_USER, HOSTINGER_FTP_PASSWORD
# Variável opcional: HOSTINGER_FTP_DIR (padrão public_html)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: 'Enviar todos os arquivos (ignora o marcador do último deploy)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
      FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
      FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      FTP_DIR: ${{ vars.HOSTINGER_FTP_DIR || 'public_html' }}
      FULL: ${{ inputs.full || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar credenciais
        run: |
          for v in FTP_HOST FTP_USER FTP_PASS; do
            if [ -z "${!v}" ]; then echo "::error::Secret ausente para $v (HOSTINGER_FTP_*)"; exit 1; fi
          done
      - name: Validar site
        run: |
          for f in *.php; do php -l "$f"; done
          python3 -c "import json; d=json.load(open('updates.json')); assert d['schema']==1"
      - name: Instalar lftp
        run: sudo apt-get update -q && sudo apt-get install -y -q lftp
      - name: Enviar para a Hostinger
        run: |
          set -euo pipefail
          printf 'set ftp:ssl-force yes\nset ftp:ssl-protect-data yes\nset net:max-retries 3\nset net:timeout 60\nopen -u "%s","%s" "%s"\ncd "%s"\n' \
            "$FTP_USER" "$FTP_PASS" "$FTP_HOST" "$FTP_DIR" > connect.lftp
          # Arquivos internos nunca vão para public_html.
          skip='^(\.git/|\.github/|\.gitlab-ci\.yml$|\.gitignore$|\.deploy-sha$)'
          last=$( { cat connect.lftp; echo 'cat .deploy-sha'; } | lftp 2>/dev/null | tr -d '[:space:]' || true)
          if [ "$FULL" != "true" ] && [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "Deploy incremental: $last..$GITHUB_SHA"
            git diff --name-only --diff-filter=ACMRT "$last" "$GITHUB_SHA" | grep -Ev "$skip" > upload.txt || true
            git diff --name-only --diff-filter=D "$last" "$GITHUB_SHA" | grep -Ev "$skip" > delete.txt || true
          else
            echo "Deploy completo"
            git ls-files | grep -Ev "$skip" > upload.txt
            : > delete.txt
          fi
          echo "Enviar: $(wc -l < upload.txt) · Remover: $(wc -l < delete.txt)"
          {
            cat connect.lftp
            while IFS= read -r f; do
              d=$(dirname "$f")
              [ "$d" != "." ] && echo "mkdir -p -f \"$d\""
              echo "put -O \"$d\" \"$f\""
            done < upload.txt
            while IFS= read -r f; do echo "rm -f \"$f\""; done < delete.txt
          } > script.lftp
          lftp -f script.lftp
          echo "$GITHUB_SHA" > .deploy-sha
          { cat connect.lftp; echo 'put .deploy-sha'; } | lftp
          rm -f connect.lftp script.lftp
          echo "Publicado $GITHUB_SHA em www.pt2vhf.com"

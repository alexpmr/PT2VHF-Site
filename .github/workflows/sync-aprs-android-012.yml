name: Sync APRS Android 0.1.2 after APK upload

on:
  push:
    branches: [main]
    paths:
      - 'downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.2.apk'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-aprs-android-012
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate signed APK provenance and generate OTA manifest
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish_android_012.py
          python3 scripts/publish_android_012.py downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.2.apk
          python3 -m json.tool updates.json >/dev/null
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          file = Path('downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.2.apk')
          manifest = json.loads(Path('updates.json').read_text(encoding='utf-8'))
          p = manifest['products']['aprs-android']
          f = p['files'][0]
          assert p['version'] == '0.1.2'
          assert f['counterKey'] == 'android-apk'
          assert f['size'] == file.stat().st_size
          assert f['sha256'] == hashlib.sha256(file.read_bytes()).hexdigest()
          assert p['page'] == 'https://www.pt2vhf.com/aprs-android'
          print('VERIFIED OTA: Android v0.1.2')
          PY
      - name: Commit version, download and checksum
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          if git diff --cached --quiet; then
            echo "Manifesto já está sincronizado."
          else
            git commit -m "site(release): habilitar OTA e downloads Android v0.1.2"
            git push origin HEAD:main
          fi

name: Publish verified PT2VHF Speed Alert Android APK on official site
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-speed-site.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-speed-alert-site
  cancel-in-progress: false
env:
  SPEED_VERSION: "1.0.3-beta.1"
  SPEED_APK_SHA256: "583782781a4058042b5b97a2dfca542d148bc3d36c8ceb36b94260fd4d4065f9"
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact source APK from verified GitHub Release
        run: |
          set -euo pipefail
          version="$SPEED_VERSION"
          name="PT2VHF-Speed-Alert-v$SPEED_VERSION.apk"
          curl --fail --location --retry 3 --silent --show-error \
            -o /tmp/release.json \
            "https://api.github.com/repos/alexpmr/speed-alert/releases/tags/v$SPEED_VERSION"
          actual="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' /tmp/release.json | head -1)"
          test "$actual" = "sha256:$SPEED_APK_SHA256" || {
            echo "::error::GitHub Release digest does not match approved APK"
            exit 1
          }
          url="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' /tmp/release.json | head -1)"
          test -n "$url"
          mkdir -p downloads/speed-alert
          curl --fail --location --retry 3 --silent --show-error \
            -o "downloads/speed-alert/$name" "$url"
          echo "$SPEED_APK_SHA256  downloads/speed-alert/$name" | sha256sum -c -
          python3 scripts/publish_speed_site.py "downloads/speed-alert/$name" "$SPEED_VERSION" "$SPEED_APK_SHA256"
          php -l update.php
          php -l download.php
          php -l speed_activity.php
          php -l speed_stats.php
          python3 -m json.tool updates.json > /dev/null
      - name: Commit verified APK and publish OTA metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/speed-alert/ updates.json speed.html
          if git diff --cached --quiet; then
            echo "Already synchronized"
          else
            git commit -m "release(speed): publish verified Android v$SPEED_VERSION APK and OTA manifest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

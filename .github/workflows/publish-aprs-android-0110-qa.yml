name: Publish PT2VHF APRS Android v0.1.10 QA on official site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aprs-android-0110-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pt2vhf-android-0110-qa-site-publish
  cancel-in-progress: false

jobs:
  publish-verified-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download exact APK from verified GitHub Actions QA artifact
        shell: bash
        env:
          QA_TRANSFER_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-cb08-820e-8a65-d22641a8403d/raw?se=2026-11-09T00%3A48%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=acd15f67-cff3-5d96-88bd-03b766ec8abc&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-08T11%3A34%3A31Z&ske=2026-11-09T11%3A34%3A31Z&sks=b&skv=2026-02-06&sig=BL8R8u/u//kn75%2Bf22d5BfG99jSGjKF%2B6MwNsWSCVkA%3D"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --max-time 90 "$QA_TRANSFER_URL" --output "$RUNNER_TEMP/android_0110_qa.zip"
          unzip -t "$RUNNER_TEMP/android_0110_qa.zip" >/dev/null
          mkdir -p downloads/aprs-android
          unzip -p "$RUNNER_TEMP/android_0110_qa.zip" \
            PT2VHF_APRS_Client_Android_v0.1.10_QA.apk \
            > downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.10_QA.apk
          test "$(stat -c '%s' downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.10_QA.apk)" = 7992699
          echo '0a656898f98b354ff460c962089ccabb46ab63e76d15c78adaa9f6f905b8ac07  downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.10_QA.apk' | sha256sum -c -
          echo "QA_APK_SOURCE_AND_INTEGRITY_VERIFIED=1"

      - name: Update OTA, five-version changelog and Android features
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish_android_0110_qa.py
          python3 scripts/publish_android_0110_qa.py
          python3 -m json.tool updates.json >/dev/null
          node --check assets/js/products.js
          node --check assets/js/changelog-data.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("updates.json").read_text("utf-8"))
          f=d["products"]["aprs-android"]["files"][0]
          assert d["products"]["aprs-android"]["version"] == "0.1.10"
          assert f["counterKey"] == "android-apk"
          assert f["name"].endswith("_QA.apk")
          assert (Path("downloads/aprs-android") / f["name"]).stat().st_size == f["size"]
          print("ANDROID_SITE_OTA_BETA_QA_VALIDATED=1")
          PY

      - name: Commit APK and metadata atomically to the official site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.10_QA.apk \
            updates.json assets/js/changelog-data.js assets/js/products.js android.html
          if ! git diff --cached --quiet; then
            git commit -m "site(android): publish signed 0.1.10 QA beta and update OTA"
            git push origin HEAD:main
          fi
          echo 'SITE_ANDROID_0110_QA_PUSHED=1'

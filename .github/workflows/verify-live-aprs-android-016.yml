name: Verify public APRS Android v0.1.6 delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-aprs-android-016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify live OTA manifest and APK delivery
        shell: bash
        run: |
          set -euo pipefail
          site="https://www.pt2vhf.com"
          apk="$site/downloads/aprs-android/PT2VHF_APRS_Client_Android_v0.1.6.apk"
          for attempt in $(seq 1 18); do
            if curl --fail --location --silent --show-error --max-time 15 \
                 -H "Cache-Control: no-cache" "$site/updates.json?verify=v016-$attempt-${GITHUB_SHA}" \
                 -o "$RUNNER_TEMP/live-updates.json" \
              && jq -e '.products["aprs-android"].version == "0.1.6" and
                .products["aprs-android"].files[0].sha256 ==
                "b92bd2238a74d74b6a152974139ca8131aa9109bd62b6f460140458d9ccb64b3"' \
                "$RUNNER_TEMP/live-updates.json" >/dev/null \
              && curl --fail --location --silent --show-error --max-time 15 --head "$apk" >/dev/null; then
              echo "LIVE_ANDROID_016_APK_AND_OTA_VERIFIED=1"
              exit 0
            fi
            echo "Hostinger deployment/cache not yet confirmed ($attempt/18)"
            sleep 20
          done
          echo "::error::APRS Android v0.1.6 in GitHub site repo but not verified on live Hostinger"
          exit 1

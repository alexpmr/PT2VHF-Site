name: Verify APRS v1.15.5 on official Hostinger domain

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-aprs-v1155-live.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Wait for Hostinger update and confirm official OTA and download links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request
          BASE = "https://www.pt2vhf.com"
          headers = {"User-Agent": "PT2VHF-Site-Release-Verification/1.15.5", "Cache-Control": "no-cache"}

          def fetch(url, method="GET"):
              req=urllib.request.Request(url,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=20) as response:
                  return response.status,response.headers,response.read() if method=="GET" else b""

          manifest=None
          for attempt in range(1,19):
              try:
                  status,_,body=fetch(BASE+"/updates.json")
                  manifest=json.loads(body)["products"]["aprs"]
                  print(f"Hostinger attempt {attempt}: HTTP={status}, aprs={manifest.get('version')}",flush=True)
                  if manifest.get("version")=="1.15.5" and len(manifest.get("files",[]))==9: break
              except Exception as exc:
                  print(f"Hostinger attempt {attempt}: {exc}",flush=True)
              time.sleep(15)
          else: raise SystemExit("HOSTINGER_NOT_DEPLOYED: v1.15.5 not live after retries")

          valid=0
          for item in manifest["files"]:
              url=item["url"]
              if not url.startswith(BASE+"/downloads/aprs-client/"):
                  raise SystemExit("Invalid external URL "+url)
              try:
                  status,headers,_=fetch(url,method="HEAD")
              except Exception as exc:
                  raise SystemExit(f"DOWNLOAD_MISSING: {item['name']} - {exc}")
              length=headers.get("Content-Length")
              if status != 200 or (length is not None and int(length)!=item["size"]):
                  raise SystemExit(f"DOWNLOAD_BAD: {item['name']} status={status} len={length}")
              valid+=1
              print("DOWNLOAD_OK",item["name"],flush=True)
          status,_,body=fetch(BASE+"/update.php?product=aprs")
          ota=json.loads(body)
          if status!=200 or ota.get("version")!="1.15.5" or ota.get("status")!="available":
              raise SystemExit("OFFICIAL_OTA_NOT_READY: "+str(ota)[:500])
          print(f"VERIFIED_ON_HOSTINGER=1 version=1.15.5 binary_count={valid}")
          PY

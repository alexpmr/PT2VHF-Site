# GitLab Pages - site estático PT2VHF.
stages:
  - validate
  - deploy
  - sync

deploy_pages:
  image: alpine:3.21
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html aprs.html prop.html mesh.html sat.html prog.html 404.html robots.txt sitemap.xml updates.json public/
    - cp -r assets downloads public/
    - test -s public/index.html
    - test -s public/updates.json
    - for page in aprs prop mesh sat prog; do test -s "public/$page.html" || exit 1; done
  pages: true
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

validate_update_api:
  image: php:8.3-cli-alpine
  stage: validate
  script:
    - php -l update.php
    - php -l download.php
    - php -l prop_parts.php
    - php scripts/test_download_counter.php
    - php scripts/test_mesh_download_counter.php
    - php -r '$m=json_decode(file_get_contents("updates.json"),true); if (!is_array($m) || ($m["schema"]??null)!==1 || !isset($m["products"]["mesh"])) exit(1);'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

validate_site_javascript:
  image: node:22-alpine
  stage: validate
  script:
    - node --check assets/js/main.js
    - node --check assets/js/products.js
    - node --check assets/js/mesh-site-data.js
    - node scripts/test_mesh_page.cjs
    - for f in assets/js/locales/*.js; do node --check "$f" || exit 1; done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

validate_publish_script:
  image: python:3.12-alpine
  stage: validate
  script:
    - python -m py_compile scripts/sync_aprs_manifest.py scripts/import_aprs_bundle.py scripts/sync_mesh_release.py scripts/sync_prop_manifest.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'




# O site é mantido na Hostinger via integração Git já existente.
# Token efêmero deste próprio projeto GitLab (push habilitado no repositório).
sync_mesh_release:
  stage: sync
  image: python:3.12-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - updates.json
        - scripts/sync_mesh_release.py
      when: on_success
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - python scripts/sync_mesh_release.py
    - git add -A updates.json downloads/mesh-analyzer
    - |
      if git diff --cached --quiet; then
        echo "Os pacotes já estão sincronizados."
      else
        git -c user.name="PT2VHF Release Bot" -c user.email="ci@pt2vhf.com" commit -m "release(mesh): binarios oficiais"
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/pt2vhf-group/pt2vhf-site.git" HEAD:main
      fi
  timeout: 50m

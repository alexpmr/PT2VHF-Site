# GitLab Pages - site estático PT2VHF.
stages:
  - validate
  - deploy

deploy_pages:
  image: alpine:3.21
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html aprs.html prop.html mesh.html sat.html prog.html 404.html robots.txt sitemap.xml updates.json public/
    - cp -r assets downloads public/
    - test -s public/index.html
    - test -s public/updates.json
    - for page in aprs prop mesh sat prog; do test -s "public/$page.html" || exit 1; done
  pages: true
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

validate_update_api:
  image: php:8.3-cli-alpine
  stage: validate
  script:
    - php -l update.php
    - php -l download.php
    - php -r '$m=json_decode(file_get_contents("updates.json"),true); if (!is_array($m) || ($m["schema"]??null)!==1 || !isset($m["products"]["mesh"])) exit(1);'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

validate_site_javascript:
  image: node:22-alpine
  stage: validate
  script:
    - node --check assets/js/main.js
    - node --check assets/js/products.js
    - for f in assets/js/locales/*.js; do node --check "$f" || exit 1; done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

validate_publish_script:
  image: python:3.12-alpine
  stage: validate
  script:
    - python -m py_compile scripts/sync_aprs_manifest.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


# Pacote de transferência para Hostinger: arquivos de instalação reais e
# updates.json com tamanhos/hashes calculados. NÃO altera a versão pública:
# a ativação ocorre apenas depois do upload e conferência na Hostinger.
package_aprs_11459_hostinger:
  stage: deploy
  image: python:3.12-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache curl unzip zip
  script:
    - set -eu
    - mkdir -p /tmp/aprs-win /tmp/aprs-linux downloads/aprs-client out
    - 'curl --fail --location --silent --show-error --retry 2 --header "JOB-TOKEN: $CI_JOB_TOKEN" "https://gitlab.com/api/v4/projects/88080976/jobs/17458873700/artifacts" -o /tmp/aprs-win.zip'
    - 'curl --fail --location --silent --show-error --retry 2 --header "JOB-TOKEN: $CI_JOB_TOKEN" "https://gitlab.com/api/v4/projects/88080976/jobs/17458873699/artifacts" -o /tmp/aprs-linux.zip'
    - unzip -q /tmp/aprs-win.zip -d /tmp/aprs-win
    - unzip -q /tmp/aprs-linux.zip -d /tmp/aprs-linux
    - cp /tmp/aprs-win/dist-installer/PT2VHF_APRS_Client_Setup_x64_v1.14.59.exe downloads/aprs-client/
    - cp /tmp/aprs-win/dist-installer/PT2VHF_APRS_Client_Portable_x64_v1.14.59.exe downloads/aprs-client/
    - cp /tmp/aprs-linux/dist-linux/PT2VHF_APRS_Client_x86_64_v1.14.59.AppImage downloads/aprs-client/
    - cp /tmp/aprs-linux/dist-linux/pt2vhf-aprs-client_1.14.59_amd64.deb downloads/aprs-client/
    - cp /tmp/aprs-linux/dist-linux/PT2VHF_APRS_Client_Linux_x86_64_v1.14.59.tar.gz downloads/aprs-client/
    - python scripts/sync_aprs_manifest.py --version 1.14.59 --apply
    - 'python -c "import json;d=json.load(open(\"updates.json\"));f=d[\"products\"][\"aprs\"][\"files\"];assert d[\"products\"][\"aprs\"][\"version\"] == \"1.14.59\" and len(f) == 5;print(\"Verificados\",len(f),\"pacotes\")"'
    - mkdir -p /tmp/aprs-hostinger-package/downloads/aprs-client
    - cp updates.json /tmp/aprs-hostinger-package/
    - cp downloads/aprs-client/* /tmp/aprs-hostinger-package/downloads/aprs-client/
    - '(cd /tmp/aprs-hostinger-package && zip -q -r "$CI_PROJECT_DIR/out/PT2VHF-APRS-1.14.59-Publicacao-Site.zip" updates.json downloads)'
    - ls -lh out/
  artifacts:
    when: on_success
    expire_in: 30 days
    paths:
      - out/PT2VHF-APRS-1.14.59-Publicacao-Site.zip
  timeout: 45m

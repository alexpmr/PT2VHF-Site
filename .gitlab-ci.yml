# Publica o site no GitLab Pages a cada push na branch main.
pages:
  image: alpine:latest
  stage: deploy
  script:
    - mkdir -p public
    - cp -r index.html 404.html robots.txt sitemap.xml assets downloads public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
